<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirPlay grayscale comparison / 灰階比對</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;background:#000}
main{height:calc(100% - 64px);display:grid;grid-template-rows:1fr 1fr}.row{display:flex;gap:12px;padding:28px 48px}.white{background:#fff}.patch{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;text-align:center;color:#8e8e93;font-size:16px}.white .patch{color:#3a3a3c}.swatch{flex:1;background:rgb(var(--v),var(--v),var(--v))}footer{height:64px;display:flex;align-items:center;justify-content:center;text-align:center;color:#9c9ca3;background:#0e0e10;font-size:14px;padding:8px 32px}
</style>
<main>
<div class="row">
<div class="patch" style="--v:0"><div class="swatch"></div>0</div>
<div class="patch" style="--v:4"><div class="swatch"></div>4</div>
<div class="patch" style="--v:8"><div class="swatch"></div>8</div>
<div class="patch" style="--v:12"><div class="swatch"></div>12</div>
<div class="patch" style="--v:16"><div class="swatch"></div>16</div>
<div class="patch" style="--v:20"><div class="swatch"></div>20</div>
<div class="patch" style="--v:24"><div class="swatch"></div>24</div>
<div class="patch" style="--v:32"><div class="swatch"></div>32</div>
</div>
<div class="row white">
<div class="patch" style="--v:223"><div class="swatch"></div>223</div>
<div class="patch" style="--v:231"><div class="swatch"></div>231</div>
<div class="patch" style="--v:235"><div class="swatch"></div>235</div>
<div class="patch" style="--v:239"><div class="swatch"></div>239</div>
<div class="patch" style="--v:243"><div class="swatch"></div>243</div>
<div class="patch" style="--v:247"><div class="swatch"></div>247</div>
<div class="patch" style="--v:251"><div class="swatch"></div>251</div>
<div class="patch" style="--v:255"><div class="swatch"></div>255</div>
</div>
</main>
<footer>Compare this page over AirPlay with the TV app’s local Grayscale Test. It does not prove lossless video.<br>將此頁投屏，與電視 App 本機「灰階測試」比對；這不能證明投屏沒有壓縮。</footer>
</html>
